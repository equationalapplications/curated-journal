name: EAS store build and submit

# Builds store binaries (AAB / IPA) on EAS and auto-submits them with the
# credentials stored on expo.dev. Android lands on the Play internal track
# as a draft; iOS lands in App Store Connect / TestFlight. Promotion to
# production is a manual step in each console. See docs/VERSIONING.md.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26.12.1"
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: EAS build and submit
        run: >-
          eas build --platform ${{ inputs.platform }} --profile production
          --non-interactive --auto-submit --no-wait
